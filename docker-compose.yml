services:
  filehost:
    image: ghcr.io/maximilian1121/filehost-sftp:latest
    # build: .
    container_name: maxs-filehost
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "2222:2222"
    environment:
      SFTP_PORT: 2222
      SFTP_USERNAME: admin
      SFTP_PASSWORD: ${SFTP_PASSWORD:?set SFTP_PASSWORD in .env}
      SFTP_PASSWORD_AUTH_ENABLED: "true"
      SFTP_AUTHORIZED_KEYS_FILE: /app/authorized_keys
    volumes:
      - filehost-data:/app/files
      - ./hostkey.ser:/app/hostkey.ser
      - ./authorized_keys:/app/authorized_keys:ro

volumes:
  filehost-data: